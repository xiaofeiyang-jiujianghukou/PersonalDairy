[package]
name = "personal-diary-desktop"
version = "0.16.30"
description = "我的日记 · Linux 桌面应用登录壳"
authors = ["you"]
edition = "2021"

# Tauri 宿主(把 apps/web 构建产物包成桌面窗口)
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 桌面应用只用 main.rs 驱动;保留 lib.rs 以兼容 v2 模板(便于未来接移动端)
[lib]
name = "personal_diary_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
# 速度优先:关掉 LTO、放开并行编译单元。
# LTO 会把整棵依赖树做一次全局优化,每次构建都要重来一遍 —— 实测是电脑端打包慢的主因。
# 这个 App 的 Rust 侧只做窗口/HTTP/文件,没有性能敏感代码,关掉 LTO 完全够用。
lto = false
codegen-units = 16
incremental = true
