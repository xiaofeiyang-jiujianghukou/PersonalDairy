[package]
name = "personal-diary-desktop"
version = "0.2.5"
description = "我的日记 · Linux 桌面应用登录壳"
authors = ["you"]
edition = "2021"

# Tauri 宿主(把 apps/web 构建产物包成桌面窗口)
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 桌面应用只用 main.rs 驱动;保留 lib.rs 以兼容 v2 模板(便于未来接移动端)
[lib]
name = "personal_diary_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
